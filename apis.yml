description: >-
  Traiana, part of CME Group and now operating under OSTTRA, is a leading market infrastructure technology provider
  offering pre-trade risk monitoring and automated post-trade processing for listed and OTC trading. Its Harmony network
  connects over 1,000 firms via a cloud-based platform supporting 15,000 cross-asset trading relationships and handling
  $2 trillion in daily transaction volume across FX, equities, equity derivatives, and exchange-traded derivatives.
