naftiko: 1.0.0-alpha2
info:
  label: Traiana Harmony Trade Processing API — Matching
  description: 'Traiana Harmony Trade Processing API — Matching. 1 operations. Lead operation: List Match Results. Self-contained
    Naftiko capability covering one Traiana business surface.'
  tags:
  - Traiana
  - Matching
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAIANA_API_KEY: TRAIANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: harmony-trade-processing-matching
    baseUri: https://api.traiana.com/harmony/v1
    description: Traiana Harmony Trade Processing API — Matching business capability. Self-contained, no shared references.
    resources:
    - name: matching
      path: /matching
      operations:
      - name: listmatchresults
        method: GET
        description: List Match Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
        - name: fromDate
          in: query
          type: string
        - name: toDate
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.TRAIANA_API_KEY}}'
  exposes:
  - type: rest
    namespace: harmony-trade-processing-matching-rest
    port: 8080
    description: REST adapter for Traiana Harmony Trade Processing API — Matching. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/matching
      name: matching
      description: REST surface for matching.
      operations:
      - method: GET
        name: listmatchresults
        description: List Match Results
        call: harmony-trade-processing-matching.listmatchresults
        with:
          status: rest.status
          fromDate: rest.fromDate
          toDate: rest.toDate
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: harmony-trade-processing-matching-mcp
    port: 9090
    transport: http
    description: MCP adapter for Traiana Harmony Trade Processing API — Matching. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-match-results
      description: List Match Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-trade-processing-matching.listmatchresults
      with:
        status: tools.status
        fromDate: tools.fromDate
        toDate: tools.toDate
      outputParameters:
      - type: object
        mapping: $.
