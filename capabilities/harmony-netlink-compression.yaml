naftiko: 1.0.0-alpha2
info:
  label: Traiana Harmony NetLink API — Compression
  description: 'Traiana Harmony NetLink API — Compression. 2 operations. Lead operation: List Compression Runs. Self-contained
    Naftiko capability covering one Traiana business surface.'
  tags:
  - Traiana
  - Compression
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAIANA_API_KEY: TRAIANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: harmony-netlink-compression
    baseUri: https://api.traiana.com/netlink/v1
    description: Traiana Harmony NetLink API — Compression business capability. Self-contained, no shared references.
    resources:
    - name: compression-runs
      path: /compression-runs
      operations:
      - name: listcompressionruns
        method: GET
        description: List Compression Runs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
        - name: fromDate
          in: query
          type: string
      - name: createcompressionrun
        method: POST
        description: Create a Compression Run
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRAIANA_API_KEY}}'
  exposes:
  - type: rest
    namespace: harmony-netlink-compression-rest
    port: 8080
    description: REST adapter for Traiana Harmony NetLink API — Compression. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/compression-runs
      name: compression-runs
      description: REST surface for compression-runs.
      operations:
      - method: GET
        name: listcompressionruns
        description: List Compression Runs
        call: harmony-netlink-compression.listcompressionruns
        with:
          status: rest.status
          fromDate: rest.fromDate
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcompressionrun
        description: Create a Compression Run
        call: harmony-netlink-compression.createcompressionrun
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: harmony-netlink-compression-mcp
    port: 9090
    transport: http
    description: MCP adapter for Traiana Harmony NetLink API — Compression. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-compression-runs
      description: List Compression Runs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-netlink-compression.listcompressionruns
      with:
        status: tools.status
        fromDate: tools.fromDate
      outputParameters:
      - type: object
        mapping: $.
    - name: create-compression-run
      description: Create a Compression Run
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: harmony-netlink-compression.createcompressionrun
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
