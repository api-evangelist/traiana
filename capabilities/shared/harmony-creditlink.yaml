naftiko: "1.0.0-alpha1"

info:
  label: "Traiana Harmony CreditLink API"
  description: "Real-time pre-trade and post-trade credit risk management across prime-brokered, cleared, and bilateral relationships. Provides limit monitoring, breach detection, credit line modification, and trading termination."
  tags:
    - Credit Risk
    - Fintech
    - Foreign Exchange
    - Risk Management
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRAIANA_API_KEY: TRAIANA_API_KEY

capability:
  consumes:
    - type: http
      namespace: traiana-creditlink
      baseUri: https://api.traiana.com/creditlink/v1
      description: "Traiana Harmony CreditLink API for real-time credit risk management."
      authentication:
        type: apikey
        key: X-API-Key
        value: "{{env.TRAIANA_API_KEY}}"
        placement: header
      resources:
        - name: credit-limits
          path: /credit-limits
          description: "Credit limit management."
          operations:
            - name: list-credit-limits
              method: GET
              description: "List all credit limits."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-credit-limit
              method: POST
              description: "Create a new credit limit."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-credit-limit
              method: GET
              description: "Get details of a specific credit limit."
              inputParameters:
                - name: limitId
                  in: path
                  type: string
                  required: true
                  description: "Credit limit identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-credit-limit
              method: PUT
              description: "Update an existing credit limit."
              inputParameters:
                - name: limitId
                  in: path
                  type: string
                  required: true
                  description: "Credit limit identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: breaches
          path: /breaches
          description: "Credit limit breach reporting and monitoring."
          operations:
            - name: report-limit-breach
              method: POST
              description: "Report a credit limit breach."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-credit-limit-breaches
              method: GET
              description: "List credit limit breach events."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."

        - name: designation-notices
          path: /designation-notices
          description: "Designation notice management."
          operations:
            - name: list-designation-notices
              method: GET
              description: "List designation notices."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-designation-notice
              method: POST
              description: "Create a designation notice."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: utilization
          path: /utilization
          description: "Credit utilization monitoring."
          operations:
            - name: get-credit-utilization
              method: GET
              description: "Get current credit utilization."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: traiana-creditlink-rest
      resources:
        - path: /v1/credit-limits
          name: credit-limits
          description: "Credit limit management."
          operations:
            - method: GET
              name: list-credit-limits
              description: "List all credit limits."
              call: "traiana-creditlink.list-credit-limits"
              outputParameters:
                - type: array
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: traiana-creditlink-mcp
      transport: http
      tools:
        - name: list-credit-limits
          description: "List all credit limits across prime-brokered, cleared, and bilateral relationships."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-creditlink.list-credit-limits"
          outputParameters:
            - type: array
              mapping: "$."
        - name: create-credit-limit
          description: "Create a new pre-trade or post-trade credit limit."
          hints:
            readOnly: false
            idempotent: false
          call: "traiana-creditlink.create-credit-limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-credit-utilization
          description: "Get current credit utilization across all active limits."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-creditlink.get-credit-utilization"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-credit-breaches
          description: "List credit limit breach events."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-creditlink.list-credit-limit-breaches"
          outputParameters:
            - type: array
              mapping: "$."
