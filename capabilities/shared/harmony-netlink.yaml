naftiko: "1.0.0-alpha1"

info:
  label: "Traiana Harmony NetLink API"
  description: "Netting, settlement orchestration, and trade compression services. Provides on-demand intraday netting, pre-settlement netting, PvP settlement orchestration, and trade compression."
  tags:
    - Fintech
    - Netting
    - Settlement
    - Trade Compression
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRAIANA_API_KEY: TRAIANA_API_KEY

capability:
  consumes:
    - type: http
      namespace: traiana-netlink
      baseUri: https://api.traiana.com/netlink/v1
      description: "Traiana Harmony NetLink API for netting and settlement."
      authentication:
        type: apikey
        key: X-API-Key
        value: "{{env.TRAIANA_API_KEY}}"
        placement: header
      resources:
        - name: netting-sessions
          path: /netting-sessions
          description: "Netting session management."
          operations:
            - name: list-netting-sessions
              method: GET
              description: "List netting sessions."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-netting-session
              method: POST
              description: "Create a new netting session."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-netting-session
              method: GET
              description: "Get netting session details."
              inputParameters:
                - name: sessionId
                  in: path
                  type: string
                  required: true
                  description: "Netting session identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-netting-results
              method: GET
              description: "Get results from a netting session."
              inputParameters:
                - name: sessionId
                  in: path
                  type: string
                  required: true
                  description: "Netting session identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: settlements
          path: /settlements
          description: "Settlement instruction management."
          operations:
            - name: list-settlements
              method: GET
              description: "List settlement instructions."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: get-settlement
              method: GET
              description: "Get settlement instruction details."
              inputParameters:
                - name: settlementId
                  in: path
                  type: string
                  required: true
                  description: "Settlement identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: compression
          path: /compression-runs
          description: "Trade compression run management."
          operations:
            - name: list-compression-runs
              method: GET
              description: "List trade compression runs."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-compression-run
              method: POST
              description: "Create a new trade compression run."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: traiana-netlink-rest
      resources:
        - path: /v1/netting-sessions
          name: netting-sessions
          description: "Netting session operations."
          operations:
            - method: GET
              name: list-netting-sessions
              description: "List netting sessions."
              call: "traiana-netlink.list-netting-sessions"
              outputParameters:
                - type: array
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: traiana-netlink-mcp
      transport: http
      tools:
        - name: list-netting-sessions
          description: "List intraday netting sessions."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-netlink.list-netting-sessions"
          outputParameters:
            - type: array
              mapping: "$."
        - name: create-netting-session
          description: "Create a new intraday netting session."
          hints:
            readOnly: false
            idempotent: false
          call: "traiana-netlink.create-netting-session"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-netting-results
          description: "Get results from a completed netting session."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-netlink.get-netting-results"
          with:
            sessionId: "tools.sessionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-settlements
          description: "List settlement instructions generated from netting."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-netlink.list-settlements"
          outputParameters:
            - type: array
              mapping: "$."
        - name: create-compression-run
          description: "Create a trade compression run to reduce open positions."
          hints:
            readOnly: false
            idempotent: false
          call: "traiana-netlink.create-compression-run"
          outputParameters:
            - type: object
              mapping: "$."
