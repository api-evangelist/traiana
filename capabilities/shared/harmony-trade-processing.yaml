naftiko: "1.0.0-alpha1"

info:
  label: "Traiana Harmony Trade Processing API"
  description: "Cross-asset post-trade processing API for trade allocation, matching, confirmation, give-up messaging, and reporting across FX, equities, equity derivatives, and ETD."
  tags:
    - Fintech
    - Foreign Exchange
    - Post-Trade Processing
    - Trade Matching
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRAIANA_API_KEY: TRAIANA_API_KEY

capability:
  consumes:
    - type: http
      namespace: traiana-trade-processing
      baseUri: https://api.traiana.com/harmony/v1
      description: "Traiana Harmony Trade Processing API for post-trade workflows."
      authentication:
        type: apikey
        key: X-API-Key
        value: "{{env.TRAIANA_API_KEY}}"
        placement: header
      resources:
        - name: trades
          path: /trades
          description: "Trade submission, retrieval, and confirmation."
          operations:
            - name: list-trades
              method: GET
              description: "List trades processed through the Harmony network."
              inputParameters:
                - name: assetClass
                  in: query
                  type: string
                  required: false
                  description: "Filter by asset class."
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by trade status."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: submit-trade
              method: POST
              description: "Submit a new trade for processing."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-trade
              method: GET
              description: "Get details of a specific trade."
              inputParameters:
                - name: tradeId
                  in: path
                  type: string
                  required: true
                  description: "Trade identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: confirm-trade
              method: POST
              description: "Confirm a matched trade."
              inputParameters:
                - name: tradeId
                  in: path
                  type: string
                  required: true
                  description: "Trade identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: allocations
          path: /allocations
          description: "Trade allocation management."
          operations:
            - name: list-allocations
              method: GET
              description: "List trade allocations."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: submit-allocation
              method: POST
              description: "Submit a new trade allocation."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: give-ups
          path: /give-ups
          description: "Give-up message management."
          operations:
            - name: list-give-ups
              method: GET
              description: "List give-up messages."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: submit-give-up
              method: POST
              description: "Submit a give-up message."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: match-results
          path: /match-results
          description: "Trade matching results."
          operations:
            - name: list-match-results
              method: GET
              description: "List trade matching results."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: traiana-trade-processing-rest
      resources:
        - path: /v1/trades
          name: trades
          description: "Trade processing operations."
          operations:
            - method: GET
              name: list-trades
              description: "List processed trades."
              call: "traiana-trade-processing.list-trades"
              outputParameters:
                - type: array
                  mapping: "$."
            - method: POST
              name: submit-trade
              description: "Submit a trade for processing."
              call: "traiana-trade-processing.submit-trade"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: traiana-trade-processing-mcp
      transport: http
      tools:
        - name: list-trades
          description: "List trades processed through the Harmony network."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-trade-processing.list-trades"
          outputParameters:
            - type: array
              mapping: "$."
        - name: submit-trade
          description: "Submit a new trade for post-trade processing."
          hints:
            readOnly: false
            idempotent: false
          call: "traiana-trade-processing.submit-trade"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-trade
          description: "Get details of a specific trade."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-trade-processing.get-trade"
          with:
            tradeId: "tools.tradeId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: confirm-trade
          description: "Confirm a matched trade."
          hints:
            readOnly: false
            idempotent: false
          call: "traiana-trade-processing.confirm-trade"
          with:
            tradeId: "tools.tradeId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-allocations
          description: "List trade allocations."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-trade-processing.list-allocations"
          outputParameters:
            - type: array
              mapping: "$."
        - name: list-match-results
          description: "List trade matching results."
          hints:
            readOnly: true
            idempotent: true
          call: "traiana-trade-processing.list-match-results"
          outputParameters:
            - type: array
              mapping: "$."
