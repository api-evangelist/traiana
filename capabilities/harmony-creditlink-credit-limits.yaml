naftiko: 1.0.0-alpha2
info:
  label: Traiana Harmony CreditLink API — Credit Limits
  description: 'Traiana Harmony CreditLink API — Credit Limits. 6 operations. Lead operation: List Credit Limit Breaches.
    Self-contained Naftiko capability covering one Traiana business surface.'
  tags:
  - Traiana
  - Credit Limits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAIANA_API_KEY: TRAIANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: harmony-creditlink-credit-limits
    baseUri: https://api.traiana.com/creditlink/v1
    description: Traiana Harmony CreditLink API — Credit Limits business capability. Self-contained, no shared references.
    resources:
    - name: breaches
      path: /breaches
      operations:
      - name: listbreaches
        method: GET
        description: List Credit Limit Breaches
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limitId
          in: query
          type: string
        - name: fromDate
          in: query
          type: string
        - name: toDate
          in: query
          type: string
    - name: credit-limits
      path: /credit-limits
      operations:
      - name: listcreditlimits
        method: GET
        description: List Credit Limits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: counterpartyId
          in: query
          type: string
        - name: assetClass
          in: query
          type: string
        - name: relationshipType
          in: query
          type: string
      - name: createcreditlimit
        method: POST
        description: Create a Credit Limit
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: credit-limits-limitId
      path: /credit-limits/{limitId}
      operations:
      - name: getcreditlimit
        method: GET
        description: Get Credit Limit Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limitId
          in: path
          type: string
          required: true
      - name: updatecreditlimit
        method: PUT
        description: Update a Credit Limit
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limitId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: credit-limits-limitId-breach
      path: /credit-limits/{limitId}/breach
      operations:
      - name: reportbreach
        method: POST
        description: Report a Limit Breach
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limitId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRAIANA_API_KEY}}'
  exposes:
  - type: rest
    namespace: harmony-creditlink-credit-limits-rest
    port: 8080
    description: REST adapter for Traiana Harmony CreditLink API — Credit Limits. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/breaches
      name: breaches
      description: REST surface for breaches.
      operations:
      - method: GET
        name: listbreaches
        description: List Credit Limit Breaches
        call: harmony-creditlink-credit-limits.listbreaches
        with:
          limitId: rest.limitId
          fromDate: rest.fromDate
          toDate: rest.toDate
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/credit-limits
      name: credit-limits
      description: REST surface for credit-limits.
      operations:
      - method: GET
        name: listcreditlimits
        description: List Credit Limits
        call: harmony-creditlink-credit-limits.listcreditlimits
        with:
          counterpartyId: rest.counterpartyId
          assetClass: rest.assetClass
          relationshipType: rest.relationshipType
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcreditlimit
        description: Create a Credit Limit
        call: harmony-creditlink-credit-limits.createcreditlimit
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/credit-limits/{limitid}
      name: credit-limits-limitid
      description: REST surface for credit-limits-limitId.
      operations:
      - method: GET
        name: getcreditlimit
        description: Get Credit Limit Details
        call: harmony-creditlink-credit-limits.getcreditlimit
        with:
          limitId: rest.limitId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatecreditlimit
        description: Update a Credit Limit
        call: harmony-creditlink-credit-limits.updatecreditlimit
        with:
          limitId: rest.limitId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/credit-limits/{limitid}/breach
      name: credit-limits-limitid-breach
      description: REST surface for credit-limits-limitId-breach.
      operations:
      - method: POST
        name: reportbreach
        description: Report a Limit Breach
        call: harmony-creditlink-credit-limits.reportbreach
        with:
          limitId: rest.limitId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: harmony-creditlink-credit-limits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Traiana Harmony CreditLink API — Credit Limits. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-credit-limit-breaches
      description: List Credit Limit Breaches
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-creditlink-credit-limits.listbreaches
      with:
        limitId: tools.limitId
        fromDate: tools.fromDate
        toDate: tools.toDate
      outputParameters:
      - type: object
        mapping: $.
    - name: list-credit-limits
      description: List Credit Limits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-creditlink-credit-limits.listcreditlimits
      with:
        counterpartyId: tools.counterpartyId
        assetClass: tools.assetClass
        relationshipType: tools.relationshipType
      outputParameters:
      - type: object
        mapping: $.
    - name: create-credit-limit
      description: Create a Credit Limit
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: harmony-creditlink-credit-limits.createcreditlimit
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-credit-limit-details
      description: Get Credit Limit Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-creditlink-credit-limits.getcreditlimit
      with:
        limitId: tools.limitId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-credit-limit
      description: Update a Credit Limit
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: harmony-creditlink-credit-limits.updatecreditlimit
      with:
        limitId: tools.limitId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: report-limit-breach
      description: Report a Limit Breach
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: harmony-creditlink-credit-limits.reportbreach
      with:
        limitId: tools.limitId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
