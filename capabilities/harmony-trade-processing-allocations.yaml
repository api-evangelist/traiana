naftiko: 1.0.0-alpha2
info:
  label: Traiana Harmony Trade Processing API — Allocations
  description: 'Traiana Harmony Trade Processing API — Allocations. 2 operations. Lead operation: List Allocations. Self-contained
    Naftiko capability covering one Traiana business surface.'
  tags:
  - Traiana
  - Allocations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAIANA_API_KEY: TRAIANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: harmony-trade-processing-allocations
    baseUri: https://api.traiana.com/harmony/v1
    description: Traiana Harmony Trade Processing API — Allocations business capability. Self-contained, no shared references.
    resources:
    - name: allocations
      path: /allocations
      operations:
      - name: listallocations
        method: GET
        description: List Allocations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
        - name: fromDate
          in: query
          type: string
        - name: toDate
          in: query
          type: string
      - name: submitallocation
        method: POST
        description: Submit an Allocation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRAIANA_API_KEY}}'
  exposes:
  - type: rest
    namespace: harmony-trade-processing-allocations-rest
    port: 8080
    description: REST adapter for Traiana Harmony Trade Processing API — Allocations. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/allocations
      name: allocations
      description: REST surface for allocations.
      operations:
      - method: GET
        name: listallocations
        description: List Allocations
        call: harmony-trade-processing-allocations.listallocations
        with:
          status: rest.status
          fromDate: rest.fromDate
          toDate: rest.toDate
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: submitallocation
        description: Submit an Allocation
        call: harmony-trade-processing-allocations.submitallocation
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: harmony-trade-processing-allocations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Traiana Harmony Trade Processing API — Allocations. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-allocations
      description: List Allocations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-trade-processing-allocations.listallocations
      with:
        status: tools.status
        fromDate: tools.fromDate
        toDate: tools.toDate
      outputParameters:
      - type: object
        mapping: $.
    - name: submit-allocation
      description: Submit an Allocation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: harmony-trade-processing-allocations.submitallocation
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
