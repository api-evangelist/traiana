naftiko: 1.0.0-alpha2
info:
  label: Traiana Harmony CreditLink API — Designation Notices
  description: 'Traiana Harmony CreditLink API — Designation Notices. 2 operations. Lead operation: List Designation Notices.
    Self-contained Naftiko capability covering one Traiana business surface.'
  tags:
  - Traiana
  - Designation Notices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAIANA_API_KEY: TRAIANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: harmony-creditlink-designation-notices
    baseUri: https://api.traiana.com/creditlink/v1
    description: Traiana Harmony CreditLink API — Designation Notices business capability. Self-contained, no shared references.
    resources:
    - name: designation-notices
      path: /designation-notices
      operations:
      - name: listdesignationnotices
        method: GET
        description: List Designation Notices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
        - name: counterpartyId
          in: query
          type: string
      - name: createdesignationnotice
        method: POST
        description: Create a Designation Notice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRAIANA_API_KEY}}'
  exposes:
  - type: rest
    namespace: harmony-creditlink-designation-notices-rest
    port: 8080
    description: REST adapter for Traiana Harmony CreditLink API — Designation Notices. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/designation-notices
      name: designation-notices
      description: REST surface for designation-notices.
      operations:
      - method: GET
        name: listdesignationnotices
        description: List Designation Notices
        call: harmony-creditlink-designation-notices.listdesignationnotices
        with:
          status: rest.status
          counterpartyId: rest.counterpartyId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createdesignationnotice
        description: Create a Designation Notice
        call: harmony-creditlink-designation-notices.createdesignationnotice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: harmony-creditlink-designation-notices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Traiana Harmony CreditLink API — Designation Notices. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-designation-notices
      description: List Designation Notices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-creditlink-designation-notices.listdesignationnotices
      with:
        status: tools.status
        counterpartyId: tools.counterpartyId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-designation-notice
      description: Create a Designation Notice
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: harmony-creditlink-designation-notices.createdesignationnotice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
