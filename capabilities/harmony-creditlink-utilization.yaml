naftiko: 1.0.0-alpha2
info:
  label: Traiana Harmony CreditLink API — Utilization
  description: 'Traiana Harmony CreditLink API — Utilization. 1 operations. Lead operation: Get Credit Utilization. Self-contained
    Naftiko capability covering one Traiana business surface.'
  tags:
  - Traiana
  - Utilization
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAIANA_API_KEY: TRAIANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: harmony-creditlink-utilization
    baseUri: https://api.traiana.com/creditlink/v1
    description: Traiana Harmony CreditLink API — Utilization business capability. Self-contained, no shared references.
    resources:
    - name: utilization
      path: /utilization
      operations:
      - name: getcreditutilization
        method: GET
        description: Get Credit Utilization
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: counterpartyId
          in: query
          type: string
        - name: assetClass
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.TRAIANA_API_KEY}}'
  exposes:
  - type: rest
    namespace: harmony-creditlink-utilization-rest
    port: 8080
    description: REST adapter for Traiana Harmony CreditLink API — Utilization. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/utilization
      name: utilization
      description: REST surface for utilization.
      operations:
      - method: GET
        name: getcreditutilization
        description: Get Credit Utilization
        call: harmony-creditlink-utilization.getcreditutilization
        with:
          counterpartyId: rest.counterpartyId
          assetClass: rest.assetClass
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: harmony-creditlink-utilization-mcp
    port: 9090
    transport: http
    description: MCP adapter for Traiana Harmony CreditLink API — Utilization. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-credit-utilization
      description: Get Credit Utilization
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-creditlink-utilization.getcreditutilization
      with:
        counterpartyId: tools.counterpartyId
        assetClass: tools.assetClass
      outputParameters:
      - type: object
        mapping: $.
