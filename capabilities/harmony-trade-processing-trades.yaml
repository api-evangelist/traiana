naftiko: 1.0.0-alpha2
info:
  label: Traiana Harmony Trade Processing API — Trades
  description: 'Traiana Harmony Trade Processing API — Trades. 4 operations. Lead operation: List Trades. Self-contained Naftiko
    capability covering one Traiana business surface.'
  tags:
  - Traiana
  - Trades
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAIANA_API_KEY: TRAIANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: harmony-trade-processing-trades
    baseUri: https://api.traiana.com/harmony/v1
    description: Traiana Harmony Trade Processing API — Trades business capability. Self-contained, no shared references.
    resources:
    - name: trades
      path: /trades
      operations:
      - name: listtrades
        method: GET
        description: List Trades
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assetClass
          in: query
          type: string
        - name: status
          in: query
          type: string
        - name: counterpartyId
          in: query
          type: string
        - name: fromDate
          in: query
          type: string
        - name: toDate
          in: query
          type: string
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
      - name: submittrade
        method: POST
        description: Submit a Trade
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: trades-tradeId
      path: /trades/{tradeId}
      operations:
      - name: gettrade
        method: GET
        description: Get Trade Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tradeId
          in: path
          type: string
          required: true
    - name: trades-tradeId-confirm
      path: /trades/{tradeId}/confirm
      operations:
      - name: confirmtrade
        method: POST
        description: Confirm a Trade
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tradeId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.TRAIANA_API_KEY}}'
  exposes:
  - type: rest
    namespace: harmony-trade-processing-trades-rest
    port: 8080
    description: REST adapter for Traiana Harmony Trade Processing API — Trades. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/trades
      name: trades
      description: REST surface for trades.
      operations:
      - method: GET
        name: listtrades
        description: List Trades
        call: harmony-trade-processing-trades.listtrades
        with:
          assetClass: rest.assetClass
          status: rest.status
          counterpartyId: rest.counterpartyId
          fromDate: rest.fromDate
          toDate: rest.toDate
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: submittrade
        description: Submit a Trade
        call: harmony-trade-processing-trades.submittrade
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/trades/{tradeid}
      name: trades-tradeid
      description: REST surface for trades-tradeId.
      operations:
      - method: GET
        name: gettrade
        description: Get Trade Details
        call: harmony-trade-processing-trades.gettrade
        with:
          tradeId: rest.tradeId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/trades/{tradeid}/confirm
      name: trades-tradeid-confirm
      description: REST surface for trades-tradeId-confirm.
      operations:
      - method: POST
        name: confirmtrade
        description: Confirm a Trade
        call: harmony-trade-processing-trades.confirmtrade
        with:
          tradeId: rest.tradeId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: harmony-trade-processing-trades-mcp
    port: 9090
    transport: http
    description: MCP adapter for Traiana Harmony Trade Processing API — Trades. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-trades
      description: List Trades
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-trade-processing-trades.listtrades
      with:
        assetClass: tools.assetClass
        status: tools.status
        counterpartyId: tools.counterpartyId
        fromDate: tools.fromDate
        toDate: tools.toDate
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: submit-trade
      description: Submit a Trade
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: harmony-trade-processing-trades.submittrade
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-trade-details
      description: Get Trade Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: harmony-trade-processing-trades.gettrade
      with:
        tradeId: tools.tradeId
      outputParameters:
      - type: object
        mapping: $.
    - name: confirm-trade
      description: Confirm a Trade
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: harmony-trade-processing-trades.confirmtrade
      with:
        tradeId: tools.tradeId
      outputParameters:
      - type: object
        mapping: $.
