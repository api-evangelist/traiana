description: Traiana does not publish a public developer rate-limit document. Throughput, message-rate,
  and resilience SLAs are governed by the CME Group / Traiana onboarding agreement per counterparty.
sources:
  - https://www.cmegroup.com/services/traiana.html
notes: No public developer documentation indexes Traiana rate limits; operational throughput is part of
  the contract.
limits:
  - name: Traiana network message rate
    scope: counterparty-contract
    metric: varies
    limit: not publicly published; defined in onboarding agreement
policies:
  - name: Counterparty-Negotiated Throughput
    description: Message rates, batch sizes, and failover behavior are sized per institution at onboarding;
      consult the CME Group / Traiana relationship manager for actionable numbers.
