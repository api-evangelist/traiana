specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Traiana
providerId: traiana
publisherName: CME Group Inc.
serviceCategory: Post-Trade Network
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Post-Trade Processing
  - Foreign Exchange
  - Fintech
  - FinOps
  - FOCUS
description: 'FinOps shape for Traiana: contracted post-trade network fees billed by CME Group, typically
  scaled by message volume, asset class, and counterparty connections. No public meter rates are published;
  this artifact captures structural meters.'
sources:
  - https://www.cmegroup.com/services/traiana.html
notes: Pricing not publicly retrievable; meters are descriptive and unpriced.
billingModel:
  pricingCategory: Contracted Per-Message + Connectivity Fee
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Traiana
  ServiceCategory: Post-Trade Network
  ProviderName: Traiana
  PublisherName: CME Group Inc.
  InvoiceIssuerName: CME Group Inc.
  BillingCurrency: USD
meters:
  - name: post_trade_messages
    description: Count of post-trade messages (matches, allocations, novations, give-ups) processed through
      the Traiana network.
    unit: message
    aggregation: sum
    dimensions:
      - asset_class
      - service
      - counterparty
  - name: counterparty_connections
    description: Active counterparty connections / sessions enabled on the network for the institution.
    unit: connection-month
    aggregation: avg
    dimensions:
      - asset_class
      - region
  - name: connectivity_fee
    description: Recurring network connectivity / membership fee separate from per-message pricing.
    unit: month
    aggregation: sum
principles:
  - name: Visibility
    description: Reconcile the monthly CME Group invoice against your message logs by service line (FX
      Match, Harmony, etc.); request a per-asset-class breakdown from the relationship manager.
  - name: Allocation
    description: Allocate fees to the trading desk / asset class generating the post-trade volume; tag
      messages with the originating book or strategy.
  - name: Optimization
    description: Right-size connected counterparties to those actually trading; consolidate redundant
      sessions; review service-line subscriptions (give-up, allocations, risk) annually against active
      use.
  - name: Accountability
    description: Operations / middle-office head owns Traiana costs and the network agreement; trading
      desks are accountable for the volume they generate.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
